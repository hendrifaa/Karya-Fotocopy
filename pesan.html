<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesan - Karya Fotocopy</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header id="nav"></header><main class="wrap"><section style="padding-top:48px"><h1 style="font-size:2rem">Buat pesanan</h1>
<form id="orderForm" class="form"><div>

<label>Nama<input name="nama" required></label><label>No. WhatsApp<input name="hp" type="tel" required></label>
<label>Layanan<select name="layanan"><option value="fotocopy">Fotocopy</option><option value="print">Print</option><option value="scan">Scan</option><option value="laminating">Laminating</option></select></label>
<label>Dokumen<input name="file" type="file" accept=".pdf,.doc,.docx,.jpg,.png"></label>
<label>Jumlah halaman<input name="halaman" type="number" min="1" value="1"></label><label>Jumlah salinan<input name="salinan" type="number" min="1" value="1"></label>
<label>Ukuran kertas<select name="ukuran"><option>A4</option><option>F4</option><option>A3</option></select></label>
<label>Warna<select name="warna"><option value="bw">Hitam putih</option><option value="color">Warna</option></select></label>

<label><input type="checkbox" name="duplex" style="width:auto"> Bolak-balik (diskon 10%)</label>
<label>Jilid<select name="jilid"><option value="tanpa">Tanpa jilid</option><option value="lakban">Lakban</option><option value="spiral">Spiral</option><option value="hardcover">Hardcover</option></select></label>
<label>Pembayaran<select name="bayar"><option>Tunai</option><option>QRIS</option></select></label>
<label>Catatan untuk operator<textarea name="catatan" rows="2"></textarea></label></div>
<aside class="card sum"><h3>Ringkasan</h3><p id="sumRinci"></p><div class="total" id="total"></div><br><button class="btn" style="width:100%">Kirim pesanan</button></aside></form>
<div id="hasil" style="margin-top:20px"></div></section></main>
<div id="foot"></div><script src="js/app.js"></script></body></html>
